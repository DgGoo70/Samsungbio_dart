name: Update Samsung DART Financials

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DART agent
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/dart_agent.py

      - name: Commit updated data
        run: |
          git config user.name "dart-financial-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed dashboard/data.json data/raw config/company.json
          git diff --cached --quiet || git commit -m "chore: update DART financial data"
          git push
